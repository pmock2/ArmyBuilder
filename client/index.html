<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23c99a3e'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warhammer 40k 11th Edition Army Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-theme-bg text-theme-text min-h-screen font-sans antialiased selection:bg-amber-500 selection:text-black">
    <div id="root">
      <div id="init-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; color: #94a3b8; font-family: sans-serif; background: #0d1117;">
        <div style="font-size: 22px; font-weight: bold; color: #e5ebf3; margin-bottom: 8px; letter-spacing: 0.05em;">WARHAMMER 40,000</div>
        <div style="font-size: 13px; color: #7dd3fc; margin-bottom: 16px;">11th Edition Army Builder</div>
        <div style="font-size: 12px; color: #64748b;">Initializing Battle Archives...</div>
      </div>
    </div>
    <div id="fatal-error-overlay" style="display:none; position:fixed; inset:0; z-index:999999; background:#0f172a; color:#f87171; padding:24px; font-family:monospace; overflow:auto;"></div>
    <script>
      window.addEventListener('error', function(e) {
        var overlay = document.getElementById('fatal-error-overlay');
        if (overlay) {
          overlay.style.display = 'block';
          overlay.innerHTML = '<h2 style="color:#ef4444;font-size:18px;margin-bottom:12px;">⚠️ Startup Error Detected</h2>' +
            '<div style="background:#1e293b;padding:12px;border-radius:8px;border:1px solid #ef4444;margin-bottom:16px;white-space:pre-wrap;font-size:13px;">' +
            (e.message || e) + '\n\nFile: ' + (e.filename || 'unknown') + ':' + (e.lineno || 0) + '</div>' +
            '<button onclick="localStorage.clear();window.location.reload();" style="background:#ef4444;color:white;border:none;padding:10px 18px;border-radius:8px;font-weight:bold;cursor:pointer;">Clear App Cache & Reload</button>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var overlay = document.getElementById('fatal-error-overlay');
        if (overlay) {
          overlay.style.display = 'block';
          overlay.innerHTML = '<h2 style="color:#ef4444;font-size:18px;margin-bottom:12px;">⚠️ Promise Error Detected</h2>' +
            '<div style="background:#1e293b;padding:12px;border-radius:8px;border:1px solid #ef4444;margin-bottom:16px;white-space:pre-wrap;font-size:13px;">' +
            (e.reason && (e.reason.stack || e.reason.message) || e.reason || 'Unhandled Rejection') + '</div>' +
            '<button onclick="localStorage.clear();window.location.reload();" style="background:#ef4444;color:white;border:none;padding:10px 18px;border-radius:8px;font-weight:bold;cursor:pointer;">Clear App Cache & Reload</button>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
