name: Sync Competitive Meta Snapshot

on:
  schedule:
    # Runs every Monday at 09:00 UTC after weekend GTs
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest podium tournament lists from List Engine
        run: node server/sync_meta_from_listengine.js

      - name: Commit updated meta snapshot if changed
        run: |
          if git diff --quiet client/public/data/meta_snapshot.json; then
            echo "No meta snapshot changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add client/public/data/meta_snapshot.json
            git commit -m "chore: update weekly tournament meta snapshot"
            git push
          fi
