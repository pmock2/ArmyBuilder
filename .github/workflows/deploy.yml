name: Deploy to GitHub Pages

on:
  push:
    branches: ['master', 'main', 'staging']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production (master)
        uses: actions/checkout@v4
        with:
          ref: master
          path: prod

      - name: Check if staging branch exists
        id: check-staging
        run: |
          if git ls-remote --exit-code --heads https://github.com/${{ github.repository }}.git staging >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout staging
        if: steps.check-staging.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build production (master)
        run: |
          npm ci --prefix prod/client
          npm run build --prefix prod/client

      - name: Install & build staging
        if: steps.check-staging.outputs.exists == 'true'
        env:
          VITE_APP_ENV: staging
        run: |
          npm ci --prefix staging/client
          npm run build --prefix staging/client
          mkdir -p prod/client/dist/staging
          cp -r staging/client/dist/* prod/client/dist/staging/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './prod/client/dist'

      - name: Wait for artifact metadata
        run: sleep 5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
